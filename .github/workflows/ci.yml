name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync survey aggregates
        run: npm run sync:survey-aggregates

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Validate content frontmatter
        run: npm run check:content

      # Warn-only here: translations are regenerated after a DE change merges.
      - name: Compare translation heading anchors with DE
        run: npm run check:anchors

      - name: Validate vendors.json
        run: npm run check:vendors

      - name: Validate sources.json
        run: npm run check:sources

      - name: Validate glossary.json
        run: npm run check:glossary

      - name: Validate decision trees
        run: npm run check:rules

      - name: Validate readiness check
        run: npm run check:readiness

      - name: Validate scanner-checks.json
        run: npm run check:scanner

      - name: Validate survey questions
        run: npm run check:survey

      - name: Validate survey answer helpers
        run: npm run check:survey-answers

      - name: Validate survey aggregates
        run: npm run check:survey-aggregates

      - name: Evaluate survey instrument (synthetic priors)
        run: npm run evaluate:survey

      - name: Validate classify report (when present)
        run: npm run check:classify

      - name: Validate act report (when present)
        run: npm run check:act

      - name: Validate links report (when present)
        run: npm run check:links-report

      - name: Validate design-system contrast pairs (WCAG AA)
        run: npm run check:contrast

      - name: Unit tests (node:test)
        run: npm run test:unit

      - name: Build static export
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Same image as scripts/docker-visual.sh so R50 visual baselines match pixel-for-pixel.
    # Keep the tag in sync with @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
      options: --ipc=host

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build e2e static exports
        run: npm run build:e2e

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload Playwright test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  survey-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Survey Worker integration (wrangler + local D1)
        run: npm run test:survey-worker

  survey-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Seed local D1 and write aggregates
        run: npm run seed:survey-pipeline -- --n 6 --write --port 8787

      - name: Validate aggregates after pipeline write
        run: npm run check:survey-aggregates
