name: Translate on DE merge

on:
  push:
    branches: [main]
    paths:
      - "content/de/**/*.md"
      - "content/templates/*/de.md"
  workflow_dispatch:
    inputs:
      slugs:
        description: "Comma-separated DE slugs (empty = all publishable)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: translate-on-de-merge-main
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Push with the bots-push-main deploy key, not GITHUB_TOKEN: the
        # protect-main ruleset requires CI checks and only deploy keys may
        # bypass it (the Actions token can't on a personal-account repo).
        # See docs/operator-followups-2026-10.md, section B.
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.BOT_DEPLOY_KEY }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve DE slugs to translate
        id: slugs
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SLUGS: ${{ github.event.inputs.slugs }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            INPUT="${INPUT_SLUGS:-}"
            if [ -z "${INPUT// }" ]; then
              mapfile -t SLUGS < <(npx tsx scripts/changed-de-slugs.ts --all)
            else
              ARGS=()
              IFS=',' read -ra PARTS <<< "$INPUT"
              for part in "${PARTS[@]}"; do
                slug="$(echo "$part" | xargs)"
                if [ -n "$slug" ]; then
                  ARGS+=("--slug=$slug")
                fi
              done
              if [ ${#ARGS[@]} -eq 0 ]; then
                echo "No valid slugs in workflow_dispatch input."
                exit 1
              fi
              mapfile -t SLUGS < <(npx tsx scripts/changed-de-slugs.ts "${ARGS[@]}")
            fi
          else
            mapfile -t SLUGS < <(npx tsx scripts/changed-de-slugs.ts)
          fi

          if [ ${#SLUGS[@]} -eq 0 ]; then
            echo "No DE slugs with canonical content changes; skipping translate."
            echo "list=" >> "$GITHUB_OUTPUT"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          JOINED=$(printf '%s,' "${SLUGS[@]}")
          JOINED="${JOINED%,}"
          echo "Canonical DE changes: ${JOINED}"
          echo "list=${JOINED}" >> "$GITHUB_OUTPUT"
          echo "count=${#SLUGS[@]}" >> "$GITHUB_OUTPUT"

      # Downloadable templates (T49): a newly added DE template only gets its
      # missing locales (keeps a hand-reviewed EN); a changed one is fully
      # regenerated, like guide pages.
      - name: Resolve DE templates to translate
        id: templates
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          ADDED=()
          CHANGED=()
          if [ "${EVENT_NAME}" = "push" ] && [ -n "${GITHUB_EVENT_BEFORE//0/}" ]; then
            while IFS=$'\t' read -r status path; do
              id="$(basename "$(dirname "$path")")"
              case "$status" in
                A) ADDED+=("$id") ;;
                M) CHANGED+=("$id") ;;
              esac
            done < <(git diff --no-renames --name-status "${GITHUB_EVENT_BEFORE}" "${GITHUB_SHA}" -- 'content/templates/*/de.md')
          fi
          echo "added=${ADDED[*]:-}" >> "$GITHUB_OUTPUT"
          echo "changed=${CHANGED[*]:-}" >> "$GITHUB_OUTPUT"
          echo "count=$(( ${#ADDED[@]} + ${#CHANGED[@]} ))" >> "$GITHUB_OUTPUT"
          echo "Templates added: ${ADDED[*]:-none}; changed: ${CHANGED[*]:-none}"

      - name: Translate DE templates
        if: steps.templates.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}
          ADDED: ${{ steps.templates.outputs.added }}
          CHANGED: ${{ steps.templates.outputs.changed }}
        run: |
          set -euo pipefail
          for id in ${ADDED}; do
            npm run translate:templates -- "--id=${id}" --missing-only --strict
          done
          for id in ${CHANGED}; do
            npm run translate:templates -- "--id=${id}" --strict
          done

      - name: Regenerate EN/FR/IT drafts
        if: steps.slugs.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}
          SLUG_LIST: ${{ steps.slugs.outputs.list }}
        run: |
          set -euo pipefail
          ARGS=()
          IFS=',' read -ra PARTS <<< "${SLUG_LIST}"
          for slug in "${PARTS[@]}"; do
            [ -n "$slug" ] || continue
            ARGS+=("--slug=$slug")
          done

          if [ ${#ARGS[@]} -eq 0 ]; then
            echo "Slug list empty unexpectedly."
            exit 1
          fi

          npm run translate -- "${ARGS[@]}" --strict

      - name: Validate content frontmatter
        if: steps.slugs.outputs.count != '0' || steps.templates.outputs.count != '0'
        run: npm run check:content

      - name: Translations carry the DE heading anchors
        if: steps.slugs.outputs.count != '0' || steps.templates.outputs.count != '0'
        run: npm run check:anchors -- --strict

      # Gate push to main: regenerated translations must not break the static export.
      - name: Verify static export still builds
        if: steps.slugs.outputs.count != '0' || steps.templates.outputs.count != '0'
        run: npm run build

      - name: Configure git
        if: steps.slugs.outputs.count != '0' || steps.templates.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit regenerated translations
        if: steps.slugs.outputs.count != '0' || steps.templates.outputs.count != '0'
        env:
          SLUG_LIST: ${{ steps.slugs.outputs.list }}
          TEMPLATE_LIST: ${{ steps.templates.outputs.added }} ${{ steps.templates.outputs.changed }}
        run: |
          set -euo pipefail

          git add -- content/en content/fr content/it content/templates
          if git diff --cached --quiet; then
            echo "No translation file changes to commit."
            exit 0
          fi

          SLUG_LABEL="$(echo "${SLUG_LIST} ${TEMPLATE_LIST}" | xargs | tr ' ' ',')"
          git commit -m "chore(content): regenerate translations (${SLUG_LABEL})"
          git push
