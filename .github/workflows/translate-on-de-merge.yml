name: Translate on DE merge

on:
  push:
    branches: [main]
    paths:
      - "content/de/**/*.md"
      - "content/templates/*/de.md"
      - "data/readiness-check.json"
  workflow_dispatch:
    inputs:
      slugs:
        description: "Comma-separated DE slugs (empty = all publishable, unless only the readiness check is requested)"
        required: false
        default: ""
      readiness:
        description: "Fill missing EN/FR/IT strings of the readiness check (data/readiness-check.json)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: translate-on-de-merge-main
  cancel-in-progress: false

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Same Playwright image as the CI e2e job (and @playwright/test in
    # package.json), so the FR visual baselines refreshed below match CI.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy
      options: --ipc=host
    # Container steps default to sh; the scripts below use bash features
    # (pipefail, arrays, mapfile).
    defaults:
      run:
        shell: bash

    steps:
      # The Playwright image may lack git/ssh; without them checkout falls
      # back to a tarball download and the commit step can't push.
      - name: Install git and ssh
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git openssh-client

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # Push with the bots-push-main deploy key, not GITHUB_TOKEN: the
        # protect-main ruleset requires CI checks and only deploy keys may
        # bypass it (the Actions token can't on a personal-account repo).
        # See docs/operator-followups-2026-10.md, section B.
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.BOT_DEPLOY_KEY }}

      # In the container the checkout is owned by another user; without this,
      # git (used by the change detection below) refuses to run.
      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve DE slugs to translate
        id: slugs
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SLUGS: ${{ github.event.inputs.slugs }}
          INPUT_READINESS: ${{ github.event.inputs.readiness }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${INPUT_READINESS:-false}" = "true" ] && [ -z "${INPUT_SLUGS// }" ]; then
            echo "Readiness check only; no guide pages requested."
            echo "list=" >> "$GITHUB_OUTPUT"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            INPUT="${INPUT_SLUGS:-}"
            if [ -z "${INPUT// }" ]; then
              mapfile -t SLUGS < <(npx tsx scripts/changed-de-slugs.ts --all)
            else
              ARGS=()
              IFS=',' read -ra PARTS <<< "$INPUT"
              for part in "${PARTS[@]}"; do
                slug="$(echo "$part" | xargs)"
                if [ -n "$slug" ]; then
                  ARGS+=("--slug=$slug")
                fi
              done
              if [ ${#ARGS[@]} -eq 0 ]; then
                echo "No valid slugs in workflow_dispatch input."
                exit 1
              fi
              mapfile -t SLUGS < <(npx tsx scripts/changed-de-slugs.ts "${ARGS[@]}")
            fi
          else
            mapfile -t SLUGS < <(npx tsx scripts/changed-de-slugs.ts)
          fi

          if [ ${#SLUGS[@]} -eq 0 ]; then
            echo "No DE slugs with canonical content changes; skipping translate."
            echo "list=" >> "$GITHUB_OUTPUT"
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          JOINED=$(printf '%s,' "${SLUGS[@]}")
          JOINED="${JOINED%,}"
          echo "Canonical DE changes: ${JOINED}"
          echo "list=${JOINED}" >> "$GITHUB_OUTPUT"
          echo "count=${#SLUGS[@]}" >> "$GITHUB_OUTPUT"

      # Downloadable templates (T49): a newly added DE template only gets its
      # missing locales (keeps a hand-reviewed EN); a changed one is fully
      # regenerated, like guide pages.
      - name: Resolve DE templates to translate
        id: templates
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          ADDED=()
          CHANGED=()
          if [ "${EVENT_NAME}" = "push" ] && [ -n "${GITHUB_EVENT_BEFORE//0/}" ]; then
            while IFS=$'\t' read -r status path; do
              id="$(basename "$(dirname "$path")")"
              case "$status" in
                A) ADDED+=("$id") ;;
                M) CHANGED+=("$id") ;;
              esac
            done < <(git diff --no-renames --name-status "${GITHUB_EVENT_BEFORE}" "${GITHUB_SHA}" -- 'content/templates/*/de.md')
          fi
          echo "added=${ADDED[*]:-}" >> "$GITHUB_OUTPUT"
          echo "changed=${CHANGED[*]:-}" >> "$GITHUB_OUTPUT"
          echo "count=$(( ${#ADDED[@]} + ${#CHANGED[@]} ))" >> "$GITHUB_OUTPUT"
          echo "Templates added: ${ADDED[*]:-none}; changed: ${CHANGED[*]:-none}"

      - name: Translate DE templates
        if: steps.templates.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}
          ADDED: ${{ steps.templates.outputs.added }}
          CHANGED: ${{ steps.templates.outputs.changed }}
        run: |
          set -euo pipefail
          for id in ${ADDED}; do
            npm run translate:templates -- "--id=${id}" --missing-only --strict
          done
          for id in ${CHANGED}; do
            npm run translate:templates -- "--id=${id}" --strict
          done

      # Readiness check texts (T51): on push, re-translate strings whose DE
      # changed (never overwriting a translation updated in the same commit)
      # and fill missing ones; a manual run with `readiness` fills missing ones.
      - name: Resolve readiness check translation
        id: readiness
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_READINESS: ${{ github.event.inputs.readiness }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ "${INPUT_READINESS:-false}" = "true" ]; then
              echo "base=" >> "$GITHUB_OUTPUT"
              echo "count=1" >> "$GITHUB_OUTPUT"
            else
              echo "count=0" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          if [ -z "${GITHUB_EVENT_BEFORE//0/}" ] || git diff --quiet "${GITHUB_EVENT_BEFORE}" "${GITHUB_SHA}" -- data/readiness-check.json; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Only continue if something actually needs translating: the bot's own
          # commit changes this file too, and must not start another full run.
          TODO="$(npx tsx scripts/translate-readiness.ts "--base=${GITHUB_EVENT_BEFORE}" --dry-run             | grep -oE '[0-9]+ strings? to translate' | awk '{ s += $1 } END { print s + 0 }')"
          echo "Readiness strings to translate: ${TODO}"
          echo "base=${GITHUB_EVENT_BEFORE}" >> "$GITHUB_OUTPUT"
          echo "count=${TODO}" >> "$GITHUB_OUTPUT"

      - name: Translate readiness check
        if: steps.readiness.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}
          BASE: ${{ steps.readiness.outputs.base }}
        run: |
          set -euo pipefail
          if [ -n "${BASE}" ]; then
            npm run translate:readiness -- "--base=${BASE}"
          else
            npm run translate:readiness
          fi
          npm run check:readiness

      - name: Regenerate EN/FR/IT drafts
        if: steps.slugs.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL }}
          SLUG_LIST: ${{ steps.slugs.outputs.list }}
        run: |
          set -euo pipefail
          ARGS=()
          IFS=',' read -ra PARTS <<< "${SLUG_LIST}"
          for slug in "${PARTS[@]}"; do
            [ -n "$slug" ] || continue
            ARGS+=("--slug=$slug")
          done

          if [ ${#ARGS[@]} -eq 0 ]; then
            echo "Slug list empty unexpectedly."
            exit 1
          fi

          npm run translate -- "${ARGS[@]}" --strict

      - name: Validate content frontmatter
        if: steps.slugs.outputs.count != '0' || steps.templates.outputs.count != '0' || steps.readiness.outputs.count != '0'
        run: npm run check:content

      - name: Translations carry the DE heading anchors
        if: steps.slugs.outputs.count != '0' || steps.templates.outputs.count != '0' || steps.readiness.outputs.count != '0'
        run: npm run check:anchors -- --strict

      # Gate push to main: regenerated translations must not break the static export.
      - name: Verify static export still builds
        if: steps.slugs.outputs.count != '0' || steps.templates.outputs.count != '0' || steps.readiness.outputs.count != '0'
        run: npm run build

      # Keep main green: new or changed translations change FR pages (and a
      # new guide changes every page's footer, which lists all guides), so
      # the FR visual baselines are refreshed and committed together with
      # the translations. Only FR: EN/IT have no visual tests, and DE
      # baselines must never be updated by the bot without review.
      - name: Refresh FR visual baselines
        if: steps.slugs.outputs.count != '0' || steps.templates.outputs.count != '0' || steps.readiness.outputs.count != '0'
        run: |
          set -euo pipefail
          npm run build:e2e
          npx playwright test e2e/visual --grep "visual routes \(fr\)" --update-snapshots

      - name: Configure git
        if: steps.slugs.outputs.count != '0' || steps.templates.outputs.count != '0' || steps.readiness.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit regenerated translations
        if: steps.slugs.outputs.count != '0' || steps.templates.outputs.count != '0' || steps.readiness.outputs.count != '0'
        env:
          SLUG_LIST: ${{ steps.slugs.outputs.list }}
          TEMPLATE_LIST: ${{ steps.templates.outputs.added }} ${{ steps.templates.outputs.changed }}
          READINESS_LABEL: ${{ steps.readiness.outputs.count != '0' && 'readiness-check' || '' }}
        run: |
          set -euo pipefail

          git add -- content/en content/fr content/it content/templates data/readiness-check.json
          git add -- 'e2e/visual/routes.spec.ts-snapshots/fr-*'
          if git diff --cached --quiet; then
            echo "No translation file changes to commit."
            exit 0
          fi

          SLUG_LABEL="$(echo "${SLUG_LIST} ${TEMPLATE_LIST} ${READINESS_LABEL}" | xargs | tr ' ' ',')"
          git commit -m "chore(content): regenerate translations (${SLUG_LABEL})" \
            -m "Includes refreshed FR visual baselines."
          git push
