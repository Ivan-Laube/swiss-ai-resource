version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # react and react-dom are pinned to the same exact version and
      # react-dom peers on its own react version; bumping one alone fails npm ci.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # Both pinned to the same exact version; keep the lint config in step
      # with the framework.
      next:
        patterns: ["next", "eslint-config-next"]
    ignore:
      # Track the Node major we run (engines >=22, CI node 22); bump by hand
      # when the runtime moves, so types never offer APIs the runtime lacks.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint (via eslint-config-next) doesn't support TS 7 yet,
      # so `npm run lint` crashes on it. Remove once it does:
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react (via eslint-config-next) still calls
      # context.getFilename(), which ESLint 10 removed, so `npm run lint`
      # crashes. Remove once eslint-config-next supports ESLint 10.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
